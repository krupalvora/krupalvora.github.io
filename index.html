<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krupal Vora | Senior Software Engineer</title>
  <meta name="description" content="Portfolio of Krupal Vora – Senior Software Engineer, 4+ years experience." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid"></div>
  
  <!-- Animated background gears -->
  <div class="bg-gears" aria-hidden="true">
    <svg class="gear gear-1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 5 L52 15 L58 15 L60 5 L68 8 L72 18 L82 18 L78 28 L82 38 L72 38 L68 48 L60 45 L58 55 L52 55 L50 65 L48 55 L42 55 L40 45 L32 48 L28 38 L18 38 L22 28 L18 18 L28 18 L32 8 L40 5 L42 15 L48 15 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="3" fill="currentColor"/>
    </svg>
    <svg class="gear gear-2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 3 L53 16 L61 16 L64 3 L74 7 L79 19 L91 19 L86 31 L91 43 L79 43 L74 55 L64 51 L61 63 L53 63 L50 76 L47 63 L39 63 L36 51 L26 55 L21 43 L9 43 L14 31 L9 19 L21 19 L26 7 L36 3 L39 16 L47 16 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="4" fill="currentColor"/>
    </svg>
    <svg class="gear gear-3" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 8 L51.5 16 L56.5 16 L58 8 L64 10.5 L67 18 L74 18 L71 25.5 L74 33 L67 33 L64 40.5 L58 38 L56.5 46 L51.5 46 L50 54 L48.5 46 L43.5 46 L42 38 L36 40.5 L33 33 L26 33 L29 25.5 L26 18 L33 18 L36 10.5 L42 8 L43.5 16 L48.5 16 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="2.5" fill="currentColor"/>
    </svg>
    <svg class="gear gear-4" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 6 L52 14 L57 14 L59 6 L66 9 L70 17 L78 17 L75 25 L78 33 L70 33 L66 41 L59 38 L57 46 L52 46 L50 54 L48 46 L43 46 L41 38 L34 41 L30 33 L22 33 L25 25 L22 17 L30 17 L34 9 L41 6 L43 14 L48 14 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="13" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="3.5" fill="currentColor"/>
    </svg>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-mark">&gt;</span>
        <span class="logo-text" id="logo-text">kvora.dev</span>
      </div>

      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation">
          <span></span><span></span>
        </button>
        <ul class="nav-list" id="nav-list">
          <li><a href="#about">About</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#contributions">Open Source</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section hero" id="top">
      <div class="container hero-grid">
        <div class="hero-content">
          <p class="hero-kicker" id="hero-kicker"></p>
          <h1 id="hero-headline"></h1>
          <p class="hero-subtitle" id="hero-subtitle"></p>
          <div class="hero-meta" id="hero-meta"></div>
          <div class="hero-actions" id="hero-actions"></div>
          <div class="hero-links" id="hero-links"></div>
        </div>

        <aside class="hero-panel" aria-label="Profile summary">
          <div class="card hero-card">
            <div class="hero-photo-wrap">
              <img id="hero-photo" src="" alt="" class="hero-photo" />
            </div>
            <div class="status-pill" id="hero-status"></div>
            <div class="hero-chip-group" id="hero-chips"></div>
          </div>
        </aside>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container two-col">
        <div id="about-content"></div>
        <div class="about-grid" id="about-cards"></div>
      </div>
    </section>

    <section class="section" id="experience">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title" id="experience-title"></h2>
          <p class="section-subtitle" id="experience-subtitle"></p>
        </div>
        <div class="timeline" id="experience-timeline"></div>
      </div>
    </section>

    <section class="section" id="contributions">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title" id="contributions-title"></h2>
          <p class="section-subtitle" id="contributions-subtitle"></p>
        </div>
        <div class="cards-grid" id="contributions-list"></div>
      </div>
    </section>

    <section class="section" id="skills">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title" id="skills-title"></h2>
          <p class="section-subtitle" id="skills-subtitle"></p>
        </div>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title" id="projects-title"></h2>
          <p class="section-subtitle" id="projects-subtitle"></p>
        </div>
        <div class="filters" id="project-filters" aria-label="Project filters"></div>
        <div class="cards-grid" id="project-list"></div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container contact-grid">
        <div>
          <h2 class="section-title" id="contact-title"></h2>
          <p class="section-subtitle" id="contact-subtitle"></p>
          <ul class="contact-list" id="contact-list"></ul>
          <div class="contact-links" id="contact-links"></div>
        </div>

        <form class="card contact-form" id="contact-form" novalidate>
          <h3 id="form-title">Quick intro</h3>
          <p class="form-caption" id="form-caption"></p>
          <label class="field">
            <span>Name</span>
            <input type="text" name="name" placeholder="Your name" required />
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" placeholder="you@company.com" required />
          </label>
          <label class="field">
            <span>What are you building?</span>
            <textarea name="message" rows="4" placeholder="Tell me about the product, problem, or team."></textarea>
          </label>
          <button type="submit" class="btn primary full-width" id="form-submit-btn">Open mail with draft</button>
          <p class="form-output" id="form-output" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> <span id="footer-copy"></span></p>
      <p class="footer-secondary" id="footer-secondary"></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
