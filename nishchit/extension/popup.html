<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nishchit</title>
  <style>
    body { margin: 0; width: 280px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; background: #fff; }
    main { padding: 16px; }
    h1 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
    h1 img { width: 20px; height: 20px; }
    p { margin: 0 0 12px; color: #475569; }
    a.btn { display: block; text-align: center; padding: 9px 12px; border-radius: 8px; background: #1d4ed8; color: #fff; text-decoration: none; font-weight: 600; }
    a.btn:hover { background: #1e40af; }
    small { display: block; margin-top: 12px; color: #64748b; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      p { color: #94a3b8; }
      small { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <main>
    <h1><img src="icons/icon32.png" alt="">Nishchit is ready</h1>
    <p>Search a train on Nishchit. The chart is read from your own browser, so nothing goes through a server.</p>
    <a class="btn" href="https://krupalvora.github.io/nishchit/" target="_blank" rel="noopener">Open Nishchit</a>
    <small>Version <span id="version"></span>. Not affiliated with IRCTC or Indian Railways.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
